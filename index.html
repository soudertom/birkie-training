<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birkie Training Commander</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkbg: '#121212', cardbg: '#1E1E1E', accent: '#3B82F6', highlight: '#F59E0B' }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="p-4 bg-cardbg border-b border-gray-800 sticky top-0 z-50 text-center">
    <h1 class="text-xl font-bold text-accent">🎿 Birkie Training Commander</h1>
    <p class="text-xs text-gray-400">45-Min PPL + Core + Water Rower Engine</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="flex justify-around bg-cardbg p-2 border-b border-gray-800 text-xs font-bold">
    <button onclick="switchTab('generator')" id="btn-generator" class="py-2 px-3 rounded text-accent bg-gray-800">⚡ Generator</button>
    <button onclick="switchTab('library')" id="btn-library" class="py-2 px-3 rounded text-gray-400">📚 Movements</button>
    <button onclick="switchTab('log')" id="btn-log" class="py-2 px-3 rounded text-gray-400">📝 History</button>
  </nav>

  <main class="p-4 max-w-md mx-auto space-y-4">

    <!-- TAB 1: WORKOUT GENERATOR -->
    <div id="tab-generator" class="space-y-4">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <h2 class="text-sm font-bold text-highlight">⚙️ Build Today's 45-Min Session</h2>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Strength Split</label>
            <select id="workout-focus" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
              <option value="push">Push (Chest & Tris)</option>
              <option value="pull">Pull (Back & Bis)</option>
              <option value="legs">Legs (Quads & Hams)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Rowing Add-on</label>
            <select id="rowing-time" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
              <option value="0">Strength Only (45m)</option>
              <option value="20">+ 20 Min Row</option>
              <option value="30">+ 30 Min Row</option>
              <option value="45">+ 45 Min Row</option>
              <option value="60">+ 60 Min Row</option>
            </select>
          </div>
        </div>

        <button onclick="generateWorkout()" class="w-full bg-accent text-white py-2.5 rounded-lg text-xs font-bold shadow hover:bg-blue-600 transition">
          Generate Session with Progression 🚀
        </button>
      </div>

      <!-- GENERATED WORKOUT DISPLAY -->
      <div id="active-workout-card" class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3 hidden">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
          <h3 id="generated-title" class="text-sm font-bold text-accent">Session Breakdown</h3>
          <span id="generated-count" class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-highlight">45m + Core</span>
        </div>

        <div id="exercise-list" class="space-y-3"></div>
        <div id="rowing-prescription" class="space-y-2"></div>

        <button onclick="saveCompletedWorkout()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold shadow hover:bg-emerald-700 transition mt-2">
          Log Completed Session & Save PRs ✅
        </button>
      </div>
    </div>

    <!-- TAB 2: MOVEMENT DATABASE & PREFERENCES -->
    <div id="tab-library" class="space-y-4 hidden">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-highlight">🏋️ Movement Library</h2>
          <span class="text-[10px] text-gray-400">⭐ Favored | 🚫 Blocked</span>
        </div>
        
        <input type="text" id="db-search" onkeyup="filterLibrary()" placeholder="Search movement or target..." class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
        
        <div class="flex gap-2 text-[11px]">
          <button onclick="setLibraryFilter('all')" id="flt-all" class="flex-1 bg-gray-800 text-accent font-bold py-1.5 rounded border border-gray-700">All</button>
          <button onclick="setLibraryFilter('fav')" id="flt-fav" class="flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800">⭐ Favs</button>
          <button onclick="setLibraryFilter('black')" id="flt-black" class="flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800">🚫 Blocked</button>
        </div>

        <div id="library-list" class="space-y-2 max-h-[26rem] overflow-y-auto pr-1"></div>
      </div>
    </div>

    <!-- TAB 3: SESSION LOG & HISTORY -->
    <div id="tab-log" class="space-y-4 hidden">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <h2 class="text-sm font-bold text-highlight">📖 History & Past Performance</h2>
        <div id="completed-log-list" class="space-y-2 max-h-[28rem] overflow-y-auto pr-1"></div>
      </div>
    </div>

  </main>

  <script>
    const EXERCISE_DB = [
      // PUSH (Chest & Tris)
      { id: 'p1', name: 'DB / KB Floor Press', category: 'push', equipment: 'Dumbbell/KB', focus: 'Chest & Triceps', default_sets: 3, default_reps: 10, default_wt: 45 },
      { id: 'p2', name: 'DB Incline Bench Press', category: 'push', equipment: 'Dumbbell', focus: 'Upper Chest & Front Delts', default_sets: 3, default_reps: 10, default_wt: 40 },
      { id: 'p3', name: 'Single-Arm KB Push Press', category: 'push', equipment: 'Kettlebell', focus: 'Shoulder & Triceps Power', default_sets: 3, default_reps: 8, default_wt: 32 },
      { id: 'p4', name: 'DB Arnold Press', category: 'push', equipment: 'Dumbbell', focus: 'Deltoids & Stability', default_sets: 3, default_reps: 12, default_wt: 30 },
      { id: 'p5', name: 'DB Skull Crushers / Overhead Ext', category: 'push', equipment: 'Dumbbell', focus: 'Triceps Isolation', default_sets: 3, default_reps: 12, default_wt: 25 },
      { id: 'p6', name: 'Weighted Push-Ups', category: 'push', equipment: 'Bodyweight', focus: 'Chest & Core Integration', default_sets: 3, default_reps: 15, default_wt: 0 },

      // PULL (Back & Bis)
      { id: 'l1', name: 'Double KB Gorilla Rows', category: 'pull', equipment: 'Kettlebell', focus: 'Lats & Upper Back', default_sets: 3, default_reps: 10, default_wt: 44 },
      { id: 'l2', name: 'Single-Arm DB Heavy Row', category: 'pull', equipment: 'Dumbbell', focus: 'Lat Thickness & Rhomboids', default_sets: 3, default_reps: 10, default_wt: 45 },
      { id: 'l3', name: 'KB / DB Skiing Pullovers', category: 'pull', equipment: 'KB/DB', focus: 'Lat & Poling Endurance', default_sets: 3, default_reps: 12, default_wt: 32 },
      { id: 'l4', name: 'KB Renegade Rows', category: 'pull', equipment: 'Kettlebell', focus: 'Anti-Rotation Back & Core', default_sets: 3, default_reps: 8, default_wt: 32 },
      { id: 'l5', name: 'DB Incline Prone Rows', category: 'pull', equipment: 'Dumbbell', focus: 'Rear Delts & Mid-Back', default_sets: 3, default_reps: 12, default_wt: 30 },
      { id: 'l6', name: 'DB / KB Hammer Curls', category: 'pull', equipment: 'Dumbbell/KB', focus: 'Brachialis & Biceps', default_sets: 3, default_reps: 12, default_wt: 25 },

      // LEGS (Quads, Hamstrings, Glutes)
      { id: 'g1', name: 'Double KB Goblet Squat', category: 'legs', equipment: 'Kettlebell', focus: 'Quads & Upper Back Posture', default_sets: 3, default_reps: 10, default_wt: 44 },
      { id: 'g2', name: 'DB Bulgarian Split Squats', category: 'legs', equipment: 'Dumbbell', focus: 'Unilateral Quad/Glute Drive', default_sets: 3, default_reps: 8, default_wt: 30 },
      { id: 'g3', name: 'Kettlebell Romanian Deadlift (RDL)', category: 'legs', equipment: 'Kettlebell', focus: 'Hamstrings & Posterior Chain', default_sets: 3, default_reps: 12, default_wt: 52.5 },
      { id: 'g4', name: 'Single-Leg DB Deadlift', category: 'legs', equipment: 'Dumbbell', focus: 'Balance & Hamstring Isolation', default_sets: 3, default_reps: 10, default_wt: 35 },
      { id: 'g5', name: 'KB Front Rack Walking Lunges', category: 'legs', equipment: 'Kettlebell', focus: 'Leg Endurance & Core', default_sets: 3, default_reps: 12, default_wt: 32 },

      // DEDICATED CORE (5-Min Block)
      { id: 'c1', name: 'Russian Kettlebell Twings / Russian Twists', category: 'core', equipment: 'Kettlebell', focus: 'Rotational Core', default_sets: 3, default_reps: 20, default_wt: 32 },
      { id: 'c2', name: 'KB Bottoms-Up Carry / Suitcase Carry', category: 'core', equipment: 'Kettlebell', focus: 'Anti-Lateral Flexion Core', default_sets: 3, default_reps: 45, default_wt: 44 },
      { id: 'c3', name: 'Hollow Body Hold / Floor Leg Raises', category: 'core', equipment: 'Bodyweight', focus: 'Deep Abdominal Wall', default_sets: 3, default_reps: 15, default_wt: 0 },
      { id: 'c4', name: 'Turkish Get-Up (Single Heavy Rep)', category: 'core', equipment: 'Kettlebell', focus: 'Total Core & Shoulder Stability', default_sets: 2, default_reps: 3, default_wt: 32 }
    ];

    let userPrefs = JSON.parse(localStorage.getItem('birkie_exercise_prefs') || '{"favorites":[],"blacklist":[]}');
    let exerciseHistory = JSON.parse(localStorage.getItem('birkie_exercise_history') || '{}');
    let currentWorkout = { strength: [], core: null, rowingTime: 0 };
    let currentLibFilter = 'all';

    function savePrefs() {
      localStorage.setItem('birkie_exercise_prefs', JSON.stringify(userPrefs));
    }

    function toggleFavorite(id) {
      if (userPrefs.favorites.includes(id)) {
        userPrefs.favorites = userPrefs.favorites.filter(x => x !== id);
      } else {
        userPrefs.favorites.push(id);
        userPrefs.blacklist = userPrefs.blacklist.filter(x => x !== id);
      }
      savePrefs();
      renderLibrary();
    }

    function toggleBlacklist(id) {
      if (userPrefs.blacklist.includes(id)) {
        userPrefs.blacklist = userPrefs.blacklist.filter(x => x !== id);
      } else {
        userPrefs.blacklist.push(id);
        userPrefs.favorites = userPrefs.favorites.filter(x => x !== id);
      }
      savePrefs();
      renderLibrary();
    }

    function generateWorkout() {
      const focus = document.getElementById('workout-focus').value;
      const rowingMins = parseInt(document.getElementById('rowing-time').value);
      
      // 1. Pick 3 strength movements for the split
      let candidates = EXERCISE_DB.filter(e => !userPrefs.blacklist.includes(e.id) && e.category === focus);
      if (candidates.length === 0) { alert("No available movements for this split (check blacklist)."); return; }

      let weightedPool = [];
      candidates.forEach(e => {
        const weight = userPrefs.favorites.includes(e.id) ? 3 : 1;
        for (let i = 0; i < weight; i++) weightedPool.push(e);
      });

      let selectedStrength = [];
      while (selectedStrength.length < Math.min(3, candidates.length)) {
        const ex = weightedPool[Math.floor(Math.random() * weightedPool.length)];
        if (!selectedStrength.some(s => s.id === ex.id)) selectedStrength.push(ex);
      }

      // 2. Pick 1 dedicated core movement (5 min block)
      let coreCandidates = EXERCISE_DB.filter(e => !userPrefs.blacklist.includes(e.id) && e.category === 'core');
      const coreEx = coreCandidates[Math.floor(Math.random() * coreCandidates.length)];

      currentWorkout = {
        strength: selectedStrength,
        core: coreEx,
        rowingTime: rowingMins
      };

      renderCurrentWorkout();
    }

    function getProgressionSuggestion(exId, defaultSets, defaultReps, defaultWt) {
      const history = exerciseHistory[exId];
      if (!history || history.length === 0) {
        return `${defaultSets} sets x ${defaultReps} reps @ ${defaultWt} lbs <span class="text-xs text-gray-500">(Baseline)</span>`;
      }
      const last = history[history.length - 1]; // { sets, reps, weight }
      
      // Suggest progressive overload: if last reps were hit, suggest +1 rep or +2.5-5 lbs
      let suggestedReps = last.reps;
      let suggestedWt = last.weight;
      if (last.reps >= 12) {
        suggestedWt += 5;
        suggestedReps = 8; // drop reps slightly for heavier weight
      } else {
        suggestedReps += 1; // bump rep target by 1
      }

      return `<span class="text-accent font-bold">${last.sets}x${last.reps} @ ${last.weight}lbs</span> ➔ <span class="text-highlight">Target: ${last.sets}x${suggestedReps} @ ${suggestedWt}lbs</span>`;
    }

    function renderCurrentWorkout() {
      const container = document.getElementById('exercise-list');
      const rowContainer = document.getElementById('rowing-prescription');
      const card = document.getElementById('active-workout-card');
      
      card.classList.remove('hidden');
      container.innerHTML = '';

      // Render Strength + Core
      const allExs = [...currentWorkout.strength, currentWorkout.core];
      allExs.forEach((ex, index) => {
        const isCore = ex.category === 'core';
        const badge = isCore ? '<span class="text-[9px] bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded font-bold">5-MIN CORE BLOCK</span>' : `<span class="text-[9px] bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">#${index+1} Strength</span>`;
        const suggestionHtml = getProgressionSuggestion(ex.id, ex.default_sets, ex.default_reps, ex.default_wt);

        container.innerHTML += `
          <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs text-gray-100">${ex.name}</span>
              ${badge}
            </div>
            <div class="text-[11px] text-gray-300">Suggestion: ${suggestionHtml}</div>
            <div class="grid grid-cols-3 gap-1 pt-1 text-[11px]">
              <input type="number" id="sets-${ex.id}" value="${ex.default_sets}" placeholder="Sets" class="bg-gray-800 border border-gray-700 rounded p-1 text-center text-gray-200">
              <input type="number" id="reps-${ex.id}" value="${ex.default_reps}" placeholder="Reps" class="bg-gray-800 border border-gray-700 rounded p-1 text-center text-gray-200">
              <input type="number" step="0.5" id="wt-${ex.id}" value="${ex.default_wt}" placeholder="Weight" class="bg-gray-800 border border-gray-700 rounded p-1 text-center text-gray-200">
            </div>
          </div>
        `;
      });

      // Render Rowing Add-on if selected
      if (currentWorkout.rowingTime > 0) {
        let rowDesc = "";
        if (currentWorkout.rowingTime <= 20) rowDesc = "20 Min Water Rower: 5 min warm-up, 10 min structured intervals (1 min hard / 1 min steady), 5 min cool-down.";
        else if (currentWorkout.rowingTime <= 30) rowDesc = "30 Min Water Rower: Moderate steady-state pace (split rate 20-22 spm) focusing on smooth leg drive and double-poling back extension.";
        else rowDesc = `${currentWorkout.rowingTime} Min Water Rower Endurance: Long aerobic paddle with 500m hard sprints every 10 minutes.`;

        rowContainer.innerHTML = `
          <div class="bg-blue-950/40 border border-blue-900/50 p-3 rounded-lg space-y-1">
            <span class="text-xs font-bold text-accent">🚣 Water Rower Prescription (${currentWorkout.rowingTime} Mins)</span>
            <p class="text-[11px] text-gray-300">${rowDesc}</p>
          </div>
        `;
      } else {
        rowContainer.innerHTML = "";
      }
    }

    function saveCompletedWorkout() {
      const allExs = [...currentWorkout.strength, currentWorkout.core];
      const sessionLog = {
        date: new Date().toLocaleDateString(),
        rowing: currentWorkout.rowingTime,
        performances: []
      };

      allExs.forEach(ex => {
        const sets = parseInt(document.getElementById(`sets-${ex.id}`).value) || 3;
        const reps = parseInt(document.getElementById(`reps-${ex.id}`).value) || 10;
        const weight = parseFloat(document.getElementById(`wt-${ex.id}`).value) || 0;

        sessionLog.performances.push({ name: ex.name, sets, reps, weight });

        // Save to exercise history for future suggestions
        if (!exerciseHistory[ex.id]) exerciseHistory[ex.id] = [];
        exerciseHistory[ex.id].push({ date: new Date().toLocaleDateString(), sets, reps, weight });
      });

      localStorage.setItem('birkie_exercise_history', JSON.stringify(exerciseHistory));

      // Save to general completed log
      const history = JSON.parse(localStorage.getItem('birkie_workout_log') || '[]');
      history.unshift(sessionLog);
      localStorage.setItem('birkie_workout_log', JSON.stringify(history));

      alert("Workout logged successfully & progression targets updated!");
      loadCompletedLog();
      switchTab('log');
    }

    function loadCompletedLog() {
      const container = document.getElementById('completed-log-list');
      const history = JSON.parse(localStorage.getItem('birkie_workout_log') || '[]');

      if (history.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500">No session history recorded yet.</p>`;
        return;
      }

      container.innerHTML = history.map(h => `
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1.5 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-bold text-accent">SESSION — ${h.rowing > 0 ? `+ ${h.rowing}m Row` : 'Strength Only'}</span>
            <span class="text-[10px] text-gray-400 bg-gray-800 px-2 py-0.5 rounded">${h.date}</span>
          </div>
          <div class="text-[11px] text-gray-300 space-y-0.5 pt-1">
            ${h.performances.map(p => `<div>• ${p.name}: <b>${p.sets}x${p.reps} @${p.weight}lbs</b></div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderLibrary() {
      const container = document.getElementById('library-list');
      container.innerHTML = EXERCISE_DB.map(ex => {
        const isFav = userPrefs.favorites.includes(ex.id);
        const isBlack = userPrefs.blacklist.includes(ex.id);

        if (currentLibFilter === 'fav' && !isFav) return '';
        if (currentLibFilter === 'black' && !isBlack) return '';

        return `
          <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800 space-y-1 lib-item" data-search="${ex.name.toLowerCase()} ${ex.category} ${ex.focus.toLowerCase()}">
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs ${isBlack ? 'line-through text-red-400' : 'text-gray-200'}">${ex.name}</span>
              <div class="flex gap-1">
                <button onclick="toggleFavorite('${ex.id}')" class="p-1 text-xs rounded ${isFav ? 'bg-amber-500/20 text-amber-400' : 'bg-gray-800 text-gray-500'} hover:text-amber-400 transition">
                  ⭐
                </button>
                <button onclick="toggleBlacklist('${ex.id}')" class="p-1 text-xs rounded ${isBlack ? 'bg-red-500/20 text-red-400' : 'bg-gray-800 text-gray-500'} hover:text-red-400 transition">
                  🚫
                </button>
              </div>
            </div>
            <p class="text-[11px] text-gray-400">${ex.focus} — <span class="text-accent">Default: ${ex.default_sets}x${ex.default_reps} @ ${ex.default_wt}lbs</span></p>
          </div>
        `;
      }).join('');
    }

    function setLibraryFilter(filter) {
      currentLibFilter = filter;
      ['all', 'fav', 'black'].forEach(f => {
        const btn = document.getElementById(`flt-${f}`);
        if (f === filter) {
          btn.className = "flex-1 bg-gray-800 text-accent font-bold py-1.5 rounded border border-gray-700";
        } else {
          btn.className = "flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800";
        }
      });
      renderLibrary();
    }

    function filterLibrary() {
      const query = document.getElementById('db-search').value.toLowerCase();
      document.querySelectorAll('.lib-item').forEach(item => {
        item.style.display = item.getAttribute('data-search').includes(query) ? 'block' : 'none';
      });
    }

    function switchTab(tab) {
      ['generator', 'library', 'log'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).classList.remove('text-accent', 'bg-gray-800');
        document.getElementById(`btn-${t}`).classList.add('text-gray-400');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).classList.add('text-accent', 'bg-gray-800');
      document.getElementById(`btn-${tab}`).classList.remove('text-gray-400');
    }

    window.onload = function() {
      renderLibrary();
      loadCompletedLog();
    };
  </script>
</body>
</html>
