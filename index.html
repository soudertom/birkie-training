<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birkie Nordic & Strength Commander</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkbg: '#121212', cardbg: '#1E1E1E', accent: '#3B82F6', highlight: '#F59E0B' }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="p-4 bg-cardbg border-b border-gray-800 sticky top-0 z-50 text-center">
    <h1 class="text-xl font-bold text-accent">🎿 Birkie Training Commander</h1>
    <p class="text-xs text-gray-400">Kettlebell, Dumbbell & Nordic Conditioning</p>
  </header>

  <!-- Navigation Tabs -->
  <nav class="flex justify-around bg-cardbg p-2 border-b border-gray-800 text-xs font-bold">
    <button onclick="switchTab('generator')" id="btn-generator" class="py-2 px-3 rounded text-accent bg-gray-800">⚡ Generator</button>
    <button onclick="switchTab('library')" id="btn-library" class="py-2 px-3 rounded text-gray-400">📚 Movements</button>
    <button onclick="switchTab('log')" id="btn-log" class="py-2 px-3 rounded text-gray-400">📝 Session Log</button>
  </nav>

  <main class="p-4 max-w-md mx-auto space-y-4">

    <!-- TAB 1: WORKOUT GENERATOR -->
    <div id="tab-generator" class="space-y-4">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <h2 class="text-sm font-bold text-highlight">⚙️ Build Today's Session</h2>
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Target Workout Focus</label>
          <select id="workout-focus" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
            <option value="push">Push (Chest, Shoulders, Tris)</option>
            <option value="pull">Pull (Back, Biceps, Lats)</option>
            <option value="legs">Legs (Quads, Glutes, Hamstrings)</option>
            <option value="total_body">Total Body Power & Swings</option>
            <option value="birkie_ski">Ski-Specific Endurance & Core</option>
          </select>
        </div>

        <button onclick="generateWorkout()" class="w-full bg-accent text-white py-2.5 rounded-lg text-xs font-bold shadow hover:bg-blue-600 transition">
          Generate Workout 🚀
        </button>
      </div>

      <!-- GENERATED WORKOUT DISPLAY -->
      <div id="active-workout-card" class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3 hidden">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
          <h3 id="generated-title" class="text-sm font-bold text-accent">Today's Workout</h3>
          <span id="generated-count" class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-highlight">5 Movements</span>
        </div>

        <div id="exercise-list" class="space-y-3"></div>

        <button onclick="saveCompletedWorkout()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold shadow hover:bg-emerald-700 transition mt-2">
          Log Session as Complete ✅
        </button>
      </div>
    </div>

    <!-- TAB 2: MOVEMENT DATABASE & PREFERENCES -->
    <div id="tab-library" class="space-y-4 hidden">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-highlight">🏋️ Movement Preferences</h2>
          <span class="text-[10px] text-gray-400">⭐ Favored | 🚫 Blacklisted</span>
        </div>
        
        <input type="text" id="db-search" onkeyup="filterLibrary()" placeholder="Search movement, category, or focus..." class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-accent">
        
        <!-- Quick Filter Buttons -->
        <div class="flex gap-2 text-[11px]">
          <button onclick="setLibraryFilter('all')" id="flt-all" class="flex-1 bg-gray-800 text-accent font-bold py-1.5 rounded border border-gray-700">All</button>
          <button onclick="setLibraryFilter('fav')" id="flt-fav" class="flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800">⭐ Favs</button>
          <button onclick="setLibraryFilter('black')" id="flt-black" class="flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800">🚫 Blocked</button>
        </div>

        <div id="library-list" class="space-y-2 max-h-[26rem] overflow-y-auto pr-1"></div>
      </div>
    </div>

    <!-- TAB 3: SESSION LOG -->
    <div id="tab-log" class="space-y-4 hidden">
      <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
        <h2 class="text-sm font-bold text-highlight">📖 Completed Workouts</h2>
        <div id="completed-log-list" class="space-y-2 max-h-[28rem] overflow-y-auto pr-1"></div>
      </div>
    </div>

  </main>

  <script>
    const EXERCISE_DB = [
      // PUSH
      { id: 'p1', name: 'Kettlebell Floor Press', category: 'push', equipment: 'Kettlebell', focus: 'Chest & Triceps', reps: '3 sets x 10-12 reps' },
      { id: 'p2', name: 'Dumbbell Incline Bench Press', category: 'push', equipment: 'Dumbbell', focus: 'Upper Chest & Shoulders', reps: '4 sets x 8-10 reps' },
      { id: 'p3', name: 'Bottoms-Up KB Press', category: 'push', equipment: 'Kettlebell', focus: 'Shoulder Stability & Grip', reps: '3 sets x 8 reps/side' },
      { id: 'p4', name: 'Dumbbell Arnold Press', category: 'push', equipment: 'Dumbbell', focus: 'Deltoids & Rotator Cuff', reps: '3 sets x 10-12 reps' },
      { id: 'p5', name: 'Single-Arm KB Push Press', category: 'push', equipment: 'Kettlebell', focus: 'Explosive Overhead Drive', reps: '4 sets x 6 reps/side' },
      { id: 'p6', name: 'DB Overhead Triceps Extension', category: 'push', equipment: 'Dumbbell', focus: 'Triceps Isolation', reps: '3 sets x 12 reps' },

      // PULL
      { id: 'l1', name: 'Double KB Gorilla Rows', category: 'pull', equipment: 'Kettlebell', focus: 'Lat & Upper Back Power', reps: '4 sets x 10 reps' },
      { id: 'l2', name: 'Single-Arm DB Heavy Row', category: 'pull', equipment: 'Dumbbell', focus: 'Lat & Rhomboid Hypertrophy', reps: '3 sets x 8-10 reps' },
      { id: 'l3', name: 'KB / DB Skiing Pullovers', category: 'pull', equipment: 'KB/DB', focus: 'Lat & Core Poling Endurance', reps: '4 sets x 12-15 reps' },
      { id: 'l4', name: 'KB Renegade Rows', category: 'pull', equipment: 'Kettlebell', focus: 'Anti-Rotation Core & Back', reps: '3 sets x 6 reps/side' },
      { id: 'l5', name: 'DB Incline Prone Rows', category: 'pull', equipment: 'Dumbbell', focus: 'Rear Delts & Upper Back', reps: '3 sets x 12 reps' },
      { id: 'l6', name: 'KB Hammer Curls (Holding Horns)', category: 'pull', equipment: 'Kettlebell', focus: 'Forearm & Bicep Grip', reps: '3 sets x 12 reps' },

      // LEGS
      { id: 'g1', name: 'Double KB Goblet Squat', category: 'legs', equipment: 'Kettlebell', focus: 'Quads & Back Posture', reps: '4 sets x 10-12 reps' },
      { id: 'g2', name: 'DB Bulgarian Split Squats', category: 'legs', equipment: 'Dumbbell', focus: 'Single-Leg Quad/Glute Drive', reps: '3 sets x 8 reps/leg' },
      { id: 'g3', name: 'Kettlebell Romanian Deadlift (RDL)', category: 'legs', equipment: 'Kettlebell', focus: 'Hamstrings & Posterior Chain', reps: '4 sets x 10 reps' },
      { id: 'g4', name: 'Single-Leg DB Deadlift', category: 'legs', equipment: 'Dumbbell', focus: 'Ankle Stability & Balance', reps: '3 sets x 8 reps/leg' },
      { id: 'g5', name: 'KB Front Rack Walking Lunges', category: 'legs', equipment: 'Kettlebell', focus: 'Leg Endurance & Core', reps: '3 sets x 12 total steps' },

      // TOTAL BODY & SKI SPECIFIC
      { id: 't1', name: 'Russian Kettlebell Swings', category: 'total_body', equipment: 'Kettlebell', focus: 'Explosive Hip Hinge', reps: '5 sets x 15-20 reps' },
      { id: 't2', name: 'Double KB Cleans', category: 'total_body', equipment: 'Kettlebell', focus: 'Full Body Coordination', reps: '4 sets x 8 reps' },
      { id: 't3', name: 'Kettlebell Snatch', category: 'total_body', equipment: 'Kettlebell', focus: 'Cardio & Shoulder Power', reps: '4 sets x 10 reps/side' },
      { id: 't4', name: 'DB / KB Skier Swings', category: 'birkie_ski', equipment: 'KB/DB', focus: 'Double-Poling Power Transfer', reps: '4 sets x 20 reps' },
      { id: 't5', name: 'Kettlebell Thrusters', category: 'total_body', equipment: 'Kettlebell', focus: 'Leg to Overhead Power', reps: '4 sets x 8-10 reps' },
      { id: 't6', name: 'Turkish Get-Up', category: 'birkie_ski', equipment: 'Kettlebell', focus: 'Total-Body Joint Stability', reps: '3 sets x 3 reps/side' }
    ];

    let userPrefs = JSON.parse(localStorage.getItem('birkie_exercise_prefs') || '{"favorites":[],"blacklist":[]}');
    let currentWorkout = [];
    let currentLibFilter = 'all';

    function savePrefs() {
      localStorage.setItem('birkie_exercise_prefs', JSON.stringify(userPrefs));
    }

    function toggleFavorite(id) {
      if (userPrefs.favorites.includes(id)) {
        userPrefs.favorites = userPrefs.favorites.filter(x => x !== id);
      } else {
        userPrefs.favorites.push(id);
        userPrefs.blacklist = userPrefs.blacklist.filter(x => x !== id); // Remove from blacklist if favorited
      }
      savePrefs();
      renderLibrary();
    }

    function toggleBlacklist(id) {
      if (userPrefs.blacklist.includes(id)) {
        userPrefs.blacklist = userPrefs.blacklist.filter(x => x !== id);
      } else {
        userPrefs.blacklist.push(id);
        userPrefs.favorites = userPrefs.favorites.filter(x => x !== id); // Remove from favs if blacklisted
      }
      savePrefs();
      renderLibrary();
    }

    function generateWorkout() {
      const focus = document.getElementById('workout-focus').value;
      
      // Filter candidates based on focus and excluding blacklisted items
      let candidates = EXERCISE_DB.filter(e => 
        !userPrefs.blacklist.includes(e.id) &&
        (e.category === focus || (focus === 'birkie_ski' && (e.category === 'total_body' || e.category === 'birkie_ski')))
      );

      if (candidates.length === 0) {
        alert("No movements available for this focus (all movements might be blacklisted!).");
        return;
      }

      // Build weighted selection pool (Favorites appear 3x more often)
      let weightedPool = [];
      candidates.forEach(e => {
        const weight = userPrefs.favorites.includes(e.id) ? 3 : 1;
        for (let i = 0; i < weight; i++) {
          weightedPool.push(e);
        }
      });

      // Pick unique exercises
      let selected = [];
      let attempts = 0;
      const targetCount = Math.min(5, candidates.length);

      while (selected.length < targetCount && attempts < 100) {
        attempts++;
        const randomEx = weightedPool[Math.floor(Math.random() * weightedPool.length)];
        if (!selected.some(s => s.id === randomEx.id)) {
          selected.push(randomEx);
        }
      }

      currentWorkout = selected;
      renderCurrentWorkout();
    }

    function renderCurrentWorkout() {
      const container = document.getElementById('exercise-list');
      const card = document.getElementById('active-workout-card');
      
      card.classList.remove('hidden');
      container.innerHTML = '';

      currentWorkout.forEach((ex, index) => {
        const isFav = userPrefs.favorites.includes(ex.id);
        container.innerHTML += `
          <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs text-accent">${index + 1}. ${ex.name} ${isFav ? '⭐' : ''}</span>
              <button onclick="swapExercise(${index})" class="text-[10px] bg-gray-800 hover:bg-gray-700 text-highlight px-2 py-0.5 rounded transition">
                🔄 Swap
              </button>
            </div>
            <p class="text-[11px] text-gray-300 font-medium">${ex.reps}</p>
            <div class="flex justify-between items-center text-[10px] text-gray-500 pt-1">
              <span>${ex.equipment} • ${ex.focus}</span>
              <span class="uppercase font-mono">${ex.category}</span>
            </div>
          </div>
        `;
      });
    }

    function swapExercise(index) {
      const currentEx = currentWorkout[index];
      // Find non-blacklisted alternatives in same category
      const alternatives = EXERCISE_DB.filter(e => 
        e.category === currentEx.category && 
        e.id !== currentEx.id && 
        !userPrefs.blacklist.includes(e.id) &&
        !currentWorkout.some(w => w.id === e.id)
      );
      
      if (alternatives.length > 0) {
        const replacement = alternatives[Math.floor(Math.random() * alternatives.length)];
        currentWorkout[index] = replacement;
        renderCurrentWorkout();
      } else {
        alert("No other available movements in this category.");
      }
    }

    function saveCompletedWorkout() {
      const focus = document.getElementById('workout-focus').value;
      const history = JSON.parse(localStorage.getItem('birkie_workout_log') || '[]');
      
      const newEntry = {
        date: new Date().toLocaleDateString(),
        focus: focus.toUpperCase(),
        movements: currentWorkout.map(m => m.name)
      };

      history.unshift(newEntry);
      localStorage.setItem('birkie_workout_log', JSON.stringify(history));
      
      alert("Workout logged successfully!");
      loadCompletedLog();
      switchTab('log');
    }

    function loadCompletedLog() {
      const container = document.getElementById('completed-log-list');
      const history = JSON.parse(localStorage.getItem('birkie_workout_log') || '[]');

      if (history.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500">No sessions logged yet.</p>`;
        return;
      }

      container.innerHTML = history.map(h => `
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-bold text-accent">${h.focus} SESSION</span>
            <span class="text-[10px] text-gray-400 bg-gray-800 px-2 py-0.5 rounded">${h.date}</span>
          </div>
          <p class="text-[11px] text-gray-300">${h.movements.join(', ')}</p>
        </div>
      `).join('');
    }

    function renderLibrary() {
      const container = document.getElementById('library-list');
      container.innerHTML = EXERCISE_DB.map(ex => {
        const isFav = userPrefs.favorites.includes(ex.id);
        const isBlack = userPrefs.blacklist.includes(ex.id);

        if (currentLibFilter === 'fav' && !isFav) return '';
        if (currentLibFilter === 'black' && !isBlack) return '';

        return `
          <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800 space-y-1 lib-item" data-search="${ex.name.toLowerCase()} ${ex.category} ${ex.focus.toLowerCase()}">
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs ${isBlack ? 'line-through text-red-400' : 'text-gray-200'}">${ex.name}</span>
              <div class="flex gap-1">
                <button onclick="toggleFavorite('${ex.id}')" class="p-1 text-xs rounded ${isFav ? 'bg-amber-500/20 text-amber-400' : 'bg-gray-800 text-gray-500'} hover:text-amber-400 transition">
                  ⭐
                </button>
                <button onclick="toggleBlacklist('${ex.id}')" class="p-1 text-xs rounded ${isBlack ? 'bg-red-500/20 text-red-400' : 'bg-gray-800 text-gray-500'} hover:text-red-400 transition">
                  🚫
                </button>
              </div>
            </div>
            <p class="text-[11px] text-gray-400">${ex.focus} — <span class="text-accent">${ex.reps}</span></p>
          </div>
        `;
      }).join('');
    }

    function setLibraryFilter(filter) {
      currentLibFilter = filter;
      ['all', 'fav', 'black'].forEach(f => {
        const btn = document.getElementById(`flt-${f}`);
        if (f === filter) {
          btn.className = "flex-1 bg-gray-800 text-accent font-bold py-1.5 rounded border border-gray-700";
        } else {
          btn.className = "flex-1 bg-gray-900 text-gray-400 font-bold py-1.5 rounded border border-gray-800";
        }
      });
      renderLibrary();
    }

    function filterLibrary() {
      const query = document.getElementById('db-search').value.toLowerCase();
      document.querySelectorAll('.lib-item').forEach(item => {
        item.style.display = item.getAttribute('data-search').includes(query) ? 'block' : 'none';
      });
    }

    function switchTab(tab) {
      ['generator', 'library', 'log'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).classList.remove('text-accent', 'bg-gray-800');
        document.getElementById(`btn-${t}`).classList.add('text-gray-400');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).classList.add('text-accent', 'bg-gray-800');
      document.getElementById(`btn-${tab}`).classList.remove('text-gray-400');
    }

    window.onload = function() {
      renderLibrary();
      loadCompletedLog();
    };
  </script>
</body>
</html>
